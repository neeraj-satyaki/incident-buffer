[project]
name = "incident-buffer"
version = "0.1.0"
description = "Bounded ring-buffer incident capture with FastAPI dashboard"
authors = [{name = "Satyaki", email = "satyakiwork014@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "typing-extensions>=4.9",
]

[project.optional-dependencies]
dashboard = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]
exporter = [
  "httpx>=0.27",
]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
incident-buffer = "incident_buffer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_buffer"]

[tool.hatch.build.targets.wheel.shared-data]
"src/incident_buffer/static" = "incident_buffer/static"
